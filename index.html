<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leichtART Wertewelt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  /* Layout: eine ruhige Spalte, 760px, Karten pro Wert, Fortschritt oben */
  color-scheme: light;
  --petrol:#105e7d; --cyan:#1a9ac0; --gold:#d4af37; --ink:#2e3538; --muted:#5f6f75;
  --tint:#e8f1f4; --bg:#f4f8f9; --card:#ffffff; --line:#cddadf;
  --display:"Poppins","Segoe UI",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
header.top img{height:60px;width:auto;max-width:100%}
header.top .mod{font-family:var(--display);font-weight:500;font-size:1rem;color:var(--petrol);text-align:right}
header.top .mod span{display:block;font-weight:500;color:var(--muted)}
.progress{height:6px;background:var(--tint)}
.progress div{height:6px;background:var(--cyan);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
main{padding:26px 0 60px}
h1,h2,h3{font-family:var(--display);color:var(--petrol);text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:700;line-height:1.2}
h2{font-size:1.3rem;font-weight:600;line-height:1.25}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.lead{font-size:1.06rem}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--muted);letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.sel{border-color:var(--petrol);box-shadow:0 0 0 2px var(--petrol) inset}
.card.off{opacity:.5}
.choices{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{font:600 .92rem var(--body);color:var(--petrol);background:var(--card);border:1.5px solid var(--petrol);border-radius:999px;padding:7px 14px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--petrol);color:#fff}
.opt.soft[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#fff}
.opt.quiet{border-color:var(--line);color:var(--muted)}
.opt.quiet[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:#fff}
.link{font:400 .88rem var(--body);color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:6px 4px}
.link[aria-pressed="true"]{color:var(--ink);font-weight:600}
button:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.btn{font:700 1rem var(--display);border-radius:10px;padding:12px 22px;cursor:pointer;border:2px solid transparent}
.btn.primary{background:var(--gold);color:#fff}
.btn.primary:disabled{background:var(--line);color:#fff;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--petrol);border-color:var(--petrol);font-weight:600}
.hint{color:var(--muted);font-size:.9rem}
.note{background:var(--tint);border-radius:10px;padding:12px 16px}
details summary{cursor:pointer;color:var(--petrol);font-weight:600;font-size:.92rem}
details dl{margin:8px 0 0;display:grid;gap:6px}
details dt{font-weight:600;font-size:.86rem;color:var(--muted)}
details dd{margin:0}
label.pick{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
label.pick input{width:22px;height:22px;margin-top:2px;accent-color:var(--petrol);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .9rem var(--body);background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;background:var(--tint);color:var(--petrol);font-weight:600;border-radius:999px;padding:5px 12px;font-size:.92rem}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.profile h2{border-top:1px solid var(--line);padding-top:18px}
.vals{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.vals li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.vals b{font-family:var(--display);color:var(--petrol);font-weight:600}
textarea{width:100%;min-height:92px;font:400 1rem var(--body);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;background:var(--card)}
.qlabel{font-weight:600}
.small{font-size:.86rem;color:var(--muted)}
footer.foot{border-top:1px solid var(--line);padding:16px 0 30px;color:var(--muted);font-size:.86rem}
#copyout{min-height:220px}
.textblock{display:flex;flex-direction:column;gap:10px}
.textblock h3{margin-top:10px;font-size:1.12rem}
.zrow{display:flex;flex-direction:column;gap:8px}
.sub{font-family:var(--display);font-weight:500;color:var(--muted);font-size:1.1rem;margin-top:-6px}
.sub strong{display:block;font-weight:600}
.start{padding-top:22px}
.start h1{font-size:1.5rem;font-weight:600}
.start .textblock p{text-wrap:pretty}
.weiter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;break-inside:avoid}
.weiter h2{border:none;padding-top:0;margin-top:0}
.weiter p{text-wrap:pretty}
.weiter .btn{align-self:flex-start;text-decoration:none;text-align:center;text-wrap:balance}
.weiter hr{border:none;border-top:1px solid var(--line);margin:6px 0}
.weiter a.mehr{color:var(--petrol);font-weight:600}

@media (max-width:700px){br.gross{display:none}}
@media (max-width:480px){html{font-size:16px}.btn{width:100%}.nav{flex-direction:column-reverse;align-items:stretch}}
@media print{
  body{background:#fff}
  .progress,.nav,.noprint,footer.foot{display:none!important}
  header.top{border:none}
  main{padding-top:6px}
  .vals li,.card{break-inside:avoid}
  textarea{border:none;padding:0;resize:none}
}
</style>
</head>

<script>
const DATA = {"kategorien": [{"id": "K-01", "name": "Freiheit und Selbstbestimmung", "text": "Spielraum haben, selbst entscheiden und auf eigenen Beinen stehen."}, {"id": "K-02", "name": "Sicherheit und Beständigkeit", "text": "Geschützt sein, sich auf Dinge verlassen können und bewahren, was gut ist."}, {"id": "K-03", "name": "Beziehungen und Verbundenheit", "text": "Die Menschen im eigenen Leben und die Art, mit ihnen verbunden zu sein."}, {"id": "K-04", "name": "Miteinander und Haltung", "text": "Wie Menschen miteinander umgehen und wofür man selbst einsteht."}, {"id": "K-05", "name": "Sinn und Beitrag", "text": "Wofür man etwas tut und was man für andere und das Ganze beiträgt."}, {"id": "K-06", "name": "Entwicklung und Erkenntnis", "text": "Lernen, verstehen und als Mensch weiterkommen."}, {"id": "K-07", "name": "Leistung und Erfolg", "text": "Etwas erreichen, sich messen, gesehen werden und bestimmen."}, {"id": "K-08", "name": "Kreativität und Selbstverwirklichung", "text": "Eigene Ideen, eigene Form und das leben, was in einem steckt."}, {"id": "K-09", "name": "Lebensfreude und Erleben", "text": "Freude, Genuss und alles, was das Leben lebendig macht."}, {"id": "K-10", "name": "Gesundheit und innere Ruhe", "text": "Körper, Kraft und Ruhe im eigenen Leben."}, {"id": "K-11", "name": "Natur und Umwelt", "text": "Die Verbindung zur Natur und der Umgang mit ihr."}, {"id": "K-12", "name": "Wohlstand und Besitz", "text": "Geld, Eigentum und ein angenehmes Leben."}], "werte": [{"id": "W-001", "name": "Freiheit", "kategorie_id": "K-01", "kurz_gesagt": "Dir ist wichtig, möglichst wenig Grenzen und Zwänge um dich zu haben und dir Wege offen zu halten.", "daran_kann_es_sich_zeigen": "Du atmest auf, wenn du Spielraum hast. Vielleicht engt es dich ein, wenn alles bis ins Kleinste festgelegt ist.", "im_beruf": "Du möchtest Zeit, Ort oder Vorgehen deiner Arbeit mitgestalten können.", "im_privatleben": "Du möchtest Raum für eigene Wege haben, z.B. ein Wochenende ohne Plan.", "gegenpol_id": "W-007"}, {"id": "W-002", "name": "Selbstbestimmung", "kategorie_id": "K-01", "kurz_gesagt": "Dir ist wichtig, selbst zu entscheiden, wie du lebst.", "daran_kann_es_sich_zeigen": "Du möchtest gefragt werden, bevor etwas über dich entschieden wird. Rat kann dir willkommen sein, die Entscheidung triffst du gerne selbst.", "im_beruf": "Du möchtest mitreden, wenn es um deine Aufgaben, deinen Platz oder deine Zukunft geht.", "im_privatleben": "Über deine Zeit, dein Geld und deine Art zu leben entscheidest du selbst.", "gegenpol_id": null}, {"id": "W-003", "name": "Unabhängigkeit", "kategorie_id": "K-01", "kurz_gesagt": "Dir ist wichtig, auf eigenen Beinen zu stehen und nicht auf eine einzelne Person oder Stelle angewiesen zu sein.", "daran_kann_es_sich_zeigen": "Es gibt dir ein gutes Gefühl, für dich selbst sorgen zu können. Hilfe kannst du annehmen, du möchtest sie aber nicht brauchen müssen.", "im_beruf": "Du möchtest nicht von einem einzigen Arbeitgeber oder Kunden abhängen.", "im_privatleben": "Auch in einer Partnerschaft sind dir ein eigenes Einkommen, eigene Freunde oder eigene Interessen wichtig.", "gegenpol_id": "W-018"}, {"id": "W-004", "name": "Individualität", "kategorie_id": "K-01", "kurz_gesagt": "Dir ist wichtig, deine eigene Art zu haben und anders sein zu dürfen als die anderen.", "daran_kann_es_sich_zeigen": "Du hast gerne deinen eigenen Geschmack und deine eigenen Vorstellungen. Vielleicht gefällt es dir gerade, wenn etwas nicht dem entspricht, was alle machen.", "im_beruf": "Du möchtest deine eigene Handschrift einbringen, statt nur nach Schema zu arbeiten.", "im_privatleben": "Du richtest dein Leben nach deinem Geschmack ein, von der Wohnung bis zur Art, wie du feierst.", "gegenpol_id": null}, {"id": "W-005", "name": "Flexibilität", "kategorie_id": "K-01", "kurz_gesagt": "Dir ist wichtig, dich umstellen zu können, wenn sich etwas ändert, und nicht auf einen einzigen Weg festgelegt zu sein.", "daran_kann_es_sich_zeigen": "Du planst gerne so, dass noch etwas offen bleibt. Vielleicht fällt es dir leicht umzudenken, wenn etwas dazwischenkommt.", "im_beruf": "Du möchtest Arbeitszeiten oder Aufgaben anpassen können, wenn dein Leben es gerade braucht.", "im_privatleben": "Du hältst dir Pläne gerne so frei, dass du kurzfristig reagieren kannst.", "gegenpol_id": null}, {"id": "W-006", "name": "Privatsphäre", "kategorie_id": "K-01", "kurz_gesagt": "Dir ist wichtig, einen Bereich zu haben, der nur dir gehört und in den niemand ungefragt hineinschaut.", "daran_kann_es_sich_zeigen": "Du überlegst dir, wem du was erzählst. Vielleicht brauchst du eine Tür, die du zumachen kannst.", "im_beruf": "Du trennst gerne zwischen Arbeit und Privatem und bestimmst selbst, was Kollegen von dir wissen.", "im_privatleben": "Du brauchst Zeiten und Orte nur für dich, auch wenn du gerne mit anderen zusammen bist.", "gegenpol_id": "W-023"}, {"id": "W-007", "name": "Sicherheit", "kategorie_id": "K-02", "kurz_gesagt": "Dir ist wichtig, dich auf dein Leben verlassen zu können und dich geschützt und abgesichert zu fühlen.", "daran_kann_es_sich_zeigen": "Du sorgst gerne vor, z.B. mit Versicherungen. Vielleicht wägst du Risiken ab, bevor du dich entscheidest.", "im_beruf": "Ein sicherer Arbeitsplatz und ein verlässliches Einkommen haben für dich Gewicht.", "im_privatleben": "Du möchtest ein Zuhause und Verhältnisse haben, auf die du bauen kannst.", "gegenpol_id": "W-001"}, {"id": "W-008", "name": "Beständigkeit", "kategorie_id": "K-02", "kurz_gesagt": "Dir ist wichtig, dass Gutes bleiben darf und sich nicht ständig alles ändert.", "daran_kann_es_sich_zeigen": "Du hältst an dem fest, was sich bewährt hat. Vielleicht tun dir vertraute Abläufe und langjährige Verbindungen gut.", "im_beruf": "Du möchtest etwas über lange Zeit aufbauen und begleiten, statt immer wieder neu anzufangen.", "im_privatleben": "Du pflegst Freundschaften, Orte oder Gewohnheiten über viele Jahre.", "gegenpol_id": "W-072"}, {"id": "W-009", "name": "Ordnung", "kategorie_id": "K-02", "kurz_gesagt": "Dir ist wichtig, dass die Dinge klar sind und ihren Platz haben und du weißt, woran du bist.", "daran_kann_es_sich_zeigen": "Du magst es, wenn geregelt ist, wer was macht. Vielleicht sortierst du gerne erst deine Gedanken oder deinen Tisch, bevor du anfängst.", "im_beruf": "Du schätzt klare Zuständigkeiten und Absprachen.", "im_privatleben": "Du möchtest, dass geklärt ist, was offen ist: Termine, Papiere oder ein ungeklärtes Gespräch.", "gegenpol_id": "W-075"}, {"id": "W-010", "name": "Verlässlichkeit", "kategorie_id": "K-02", "kurz_gesagt": "Dir ist wichtig, dass ein Wort gilt: deines und das der anderen.", "daran_kann_es_sich_zeigen": "Du hältst, was du zusagst. Vielleicht trifft es dich, wenn Absprachen ohne ein Wort gebrochen werden.", "im_beruf": "Du möchtest mit Menschen arbeiten, auf deren Zusagen du bauen kannst, und selbst so jemand sein.", "im_privatleben": "Verabredungen und Versprechen haben für dich Gewicht, auch die kleinen.", "gegenpol_id": null}, {"id": "W-011", "name": "Tradition", "kategorie_id": "K-02", "kurz_gesagt": "Dir ist wichtig, zu bewahren, was vor dir da war, und es weiterzuführen.", "daran_kann_es_sich_zeigen": "Du führst Feste, Bräuche oder Rezepte fort, die du übernommen hast. Vielleicht fragst du bei Neuem zuerst, was sich bisher bewährt hat.", "im_beruf": "Du schätzt gewachsenes Wissen, ein Handwerk oder ein Haus mit Geschichte.", "im_privatleben": "Familienfeste und feste Rituale im Jahr bedeuten dir etwas.", "gegenpol_id": "W-065"}, {"id": "W-012", "name": "Heimat", "kategorie_id": "K-02", "kurz_gesagt": "Dir ist wichtig, dich irgendwo verwurzelt zu fühlen: an einem Ort, in einer Landschaft oder in einer Sprache.", "daran_kann_es_sich_zeigen": "Ein Dialekt, ein Geruch oder ein Blick über die Felder sagt dir: Hier bin ich zu Hause. Vielleicht zieht es dich immer wieder dorthin zurück.", "im_beruf": "Du möchtest dort arbeiten, wo du lebst, und nimmst dafür auch einen Nachteil in Kauf.", "im_privatleben": "Du pflegst die Verbindung zu deiner Gegend, deinen Leuten und deiner Sprache.", "gegenpol_id": null}, {"id": "W-013", "name": "Familie", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, dass Familie einen festen Platz in deinem Leben hat und man füreinander da ist.", "daran_kann_es_sich_zeigen": "Du fragst dich bei Entscheidungen, was sie für deine Familie bedeuten. Vielleicht ist der Tisch, an dem alle sitzen, für dich etwas Besonderes.", "im_beruf": "Deine Arbeit soll Zeit für die Familie lassen.", "im_privatleben": "Du hältst Kontakt, auch über die Entfernung, und bist da, wenn jemand dich braucht.", "gegenpol_id": null}, {"id": "W-014", "name": "Partnerschaft", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, mit einem Menschen durchs Leben zu gehen, den Alltag zu teilen und füreinander da zu sein.", "daran_kann_es_sich_zeigen": "Es tut dir gut, abends jemandem von deinem Tag zu erzählen. Vielleicht gibt dir der Gedanke Kraft, dass ihr zusammenhaltet.", "im_beruf": "Bei einem Stellenwechsel oder Umzug überlegst du, was er für euch beide bedeutet.", "im_privatleben": "Gemeinsame Zeit und gemeinsame Pläne haben einen festen Platz.", "gegenpol_id": null}, {"id": "W-015", "name": "Liebe", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, zu lieben und geliebt zu werden.", "daran_kann_es_sich_zeigen": "Du zeigst Menschen, dass sie dir am Herzen liegen. Vielleicht misst du ein gutes Leben daran, wie liebevoll es darin zugeht.", "im_beruf": "Du möchtest deine Arbeit mit Herz machen und nicht nur abarbeiten.", "im_privatleben": "Du nimmst dir Zeit für die Menschen, die du liebst, und sagst es ihnen auch.", "gegenpol_id": null}, {"id": "W-016", "name": "Freundschaft", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, Menschen an deiner Seite zu haben, die du dir selbst ausgesucht hast und die bleiben.", "daran_kann_es_sich_zeigen": "Du meldest dich, auch wenn viel los ist. Vielleicht gibt es jemanden, den du nachts um drei anrufen könntest.", "im_beruf": "Du arbeitest gerne mit Menschen, mit denen dich mehr verbindet als die Aufgabe.", "im_privatleben": "Du pflegst Freundschaften über Jahre und nimmst dir Zeit dafür.", "gegenpol_id": null}, {"id": "W-017", "name": "Gemeinschaft", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, mit anderen zusammen etwas zu tun, das einer allein nicht schafft.", "daran_kann_es_sich_zeigen": "Du bist gerne Teil einer Gruppe mit einer gemeinsamen Sache, z.B. im Verein, im Chor oder in der Nachbarschaft. Vielleicht packst du mit an, wenn alle anpacken.", "im_beruf": "Du arbeitest gerne im Team und freust dich über das, was ihr gemeinsam geschafft habt.", "im_privatleben": "Du machst mit, wenn etwas gemeinsam auf die Beine gestellt wird.", "gegenpol_id": null}, {"id": "W-018", "name": "Zugehörigkeit", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, dazuzugehören und einen Platz zu haben, an dem du willkommen bist.", "daran_kann_es_sich_zeigen": "Es tut dir gut, wenn man merkt, dass du fehlst. Vielleicht spürst du es deutlich, wenn du irgendwo außen vor bleibst.", "im_beruf": "Du möchtest einbezogen und gefragt werden.", "im_privatleben": "Du möchtest in deiner Familie, deinem Freundeskreis oder deinem Ort einen festen Platz haben.", "gegenpol_id": "W-003"}, {"id": "W-019", "name": "Nähe", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, einem Menschen wirklich nah zu sein und ihm zeigen zu können, wie es in dir aussieht.", "daran_kann_es_sich_zeigen": "Du redest gerne über das, was dich bewegt. Vielleicht reicht es dir auch, still nebeneinanderzusitzen und zu spüren, dass ihr zusammengehört.", "im_beruf": "Du möchtest die Menschen kennen, mit denen du arbeitest, und nicht nur ihre Aufgabe.", "im_privatleben": "Du suchst Zeit zu zweit oder im kleinen Kreis.", "gegenpol_id": null}, {"id": "W-020", "name": "Vertrauen", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, dich auf Menschen einlassen zu können, ohne auf der Hut sein zu müssen.", "daran_kann_es_sich_zeigen": "Du gehst davon aus, dass andere es gut mit dir meinen. Vielleicht ist es dir wichtig, etwas sagen zu können, das beim anderen bleibt.", "im_beruf": "Du möchtest arbeiten können, ohne dich ständig absichern zu müssen.", "im_privatleben": "Du möchtest dich bei deinen Menschen fallen lassen können.", "gegenpol_id": null}, {"id": "W-021", "name": "Loyalität", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, zu deinen Menschen und zu einer gemeinsamen Sache zu stehen, auch wenn es unbequem wird.", "daran_kann_es_sich_zeigen": "Du hältst zu jemandem, wenn andere sich abwenden. Loyal sein heißt für dich nicht, alles gutzuheißen: Vielleicht sagst du deine Meinung lieber unter vier Augen.", "im_beruf": "Du stehst zu deinem Team oder deinem Unternehmen und wünschst dir das auch umgekehrt.", "im_privatleben": "Auf dich kann man zählen, gerade wenn es jemandem schlecht geht.", "gegenpol_id": null}, {"id": "W-022", "name": "Fürsorge", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, dich um andere zu kümmern und dafür zu sorgen, dass es ihnen gut geht.", "daran_kann_es_sich_zeigen": "Du merkst, wenn jemand etwas braucht. Vielleicht kochst du gerne für andere oder fragst nach, wie es wirklich geht.", "im_beruf": "Du achtest darauf, wie es deinen Kollegen geht, und nicht nur darauf, was sie leisten.", "im_privatleben": "Du sorgst für Kinder, Eltern, Freunde oder Tiere und tust es gerne.", "gegenpol_id": "W-080"}, {"id": "W-023", "name": "Geselligkeit", "kategorie_id": "K-03", "kurz_gesagt": "Dir ist wichtig, unter Menschen zu sein, zusammenzusitzen, zu reden und zu lachen.", "daran_kann_es_sich_zeigen": "Du lädst gerne ein oder gehst gerne hin. Vielleicht tankst du in einer fröhlichen Runde auf.", "im_beruf": "Der Schwatz in der Kaffeeküche und das gemeinsame Mittagessen gehören für dich dazu.", "im_privatleben": "Ein voller Tisch und ein offenes Haus machen dir Freude.", "gegenpol_id": "W-006"}, {"id": "W-024", "name": "Ehrlichkeit", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, die Wahrheit zu sagen und die Wahrheit zu hören.", "daran_kann_es_sich_zeigen": "Du sagst lieber etwas Unbequemes als etwas Falsches. Vielleicht ist dir ein klares Nein lieber als ein halbes Ja.", "im_beruf": "Du möchtest ansprechen können, was nicht läuft, und selbst eine ehrliche Rückmeldung bekommen.", "im_privatleben": "Du möchtest, dass man sich in der Familie und unter Freunden nichts vormacht.", "gegenpol_id": null}, {"id": "W-025", "name": "Authentizität", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, dich so zu zeigen, wie du bist, und keine Rolle spielen zu müssen.", "daran_kann_es_sich_zeigen": "Du redest, wie dir der Schnabel gewachsen ist. Vielleicht strengt es dich an, wenn du dich verstellen sollst.", "im_beruf": "Du möchtest bei der Arbeit derselbe Mensch sein wie zu Hause.", "im_privatleben": "Du möchtest lachen, weinen oder albern sein dürfen, ohne dich zu fragen, wie das ankommt.", "gegenpol_id": null}, {"id": "W-026", "name": "Integrität", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, nach deinen Grundsätzen zu handeln, auch wenn es dich etwas kostet.", "daran_kann_es_sich_zeigen": "Du tust, was du für richtig hältst, auch wenn niemand zuschaut. Vielleicht verzichtest du auf einen Vorteil, der dir nicht sauber vorkommt.", "im_beruf": "Du möchtest nichts vertreten oder verkaufen müssen, hinter dem du nicht stehst.", "im_privatleben": "Du möchtest dir selbst in die Augen sehen können.", "gegenpol_id": null}, {"id": "W-028", "name": "Fairness", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, dass man anständig miteinander umgeht und für alle dieselben Regeln gelten.", "daran_kann_es_sich_zeigen": "Du spielst mit offenen Karten. Vielleicht ärgert es dich, wenn sich jemand auf Kosten anderer einen Vorteil verschafft.", "im_beruf": "Du möchtest, dass Absprachen gelten und niemand über den Tisch gezogen wird.", "im_privatleben": "Du verlierst lieber ein Spiel, als zu schummeln, und streitest ohne Tiefschläge.", "gegenpol_id": null}, {"id": "W-029", "name": "Respekt", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, dass jeder Mensch geachtet wird, egal welche Stellung er hat.", "daran_kann_es_sich_zeigen": "Du grüßt die Reinigungskraft genauso wie den Chef. Vielleicht achtest du auf den Ton, auch im Streit.", "im_beruf": "Du möchtest, dass man einander zuhört und ausreden lässt.", "im_privatleben": "Du klopfst an, bevor du eintrittst, auch im übertragenen Sinn.", "gegenpol_id": null}, {"id": "W-030", "name": "Toleranz", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, dass Menschen anders sein dürfen als du.", "daran_kann_es_sich_zeigen": "Du lässt andere Meinungen und Lebensweisen stehen. Vielleicht findest du es gerade gut, dass Menschen verschieden sind.", "im_beruf": "Du arbeitest gerne mit Menschen, die anders denken oder anders vorgehen als du.", "im_privatleben": "Du musst nicht alles gut finden, was andere tun, und lässt es trotzdem gelten.", "gegenpol_id": null}, {"id": "W-031", "name": "Gleichberechtigung", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, dass alle dieselben Rechte und Möglichkeiten haben, egal ob Frau oder Mann, jung oder alt, von hier oder von woanders.", "daran_kann_es_sich_zeigen": "Dir fällt auf, wenn jemand übergangen wird, weil er älter, jünger oder anders ist. Vielleicht sprichst du es an.", "im_beruf": "Du möchtest, dass Leistung zählt und nicht Alter, Geschlecht oder Herkunft.", "im_privatleben": "Du möchtest, dass Aufgaben und Entscheidungen zu Hause auf Augenhöhe verteilt sind.", "gegenpol_id": null}, {"id": "W-032", "name": "Hilfsbereitschaft", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, zu helfen, wenn jemand Hilfe braucht.", "daran_kann_es_sich_zeigen": "Du packst mit an, ohne lange zu fragen. Vielleicht hilfst du auch Menschen, die du gar nicht kennst.", "im_beruf": "Du springst ein, wenn ein Kollege nicht weiterkommt.", "im_privatleben": "Du hilfst beim Umzug oder fährst jemanden zum Arzt.", "gegenpol_id": null}, {"id": "W-033", "name": "Mitgefühl", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, mitzufühlen, wie es anderen geht, und nicht wegzuschauen.", "daran_kann_es_sich_zeigen": "Das Leid anderer lässt dich nicht kalt. Vielleicht merkst du, wenn es jemandem nicht gut geht, auch wenn er nichts sagt.", "im_beruf": "Du möchtest, dass der Mensch gesehen wird und nicht nur die Zahl.", "im_privatleben": "Du nimmst Anteil, wenn jemand trauert oder Sorgen hat.", "gegenpol_id": null}, {"id": "W-034", "name": "Großzügigkeit", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, gerne zu geben und zu teilen, ohne aufzurechnen.", "daran_kann_es_sich_zeigen": "Du lädst ein, verschenkst oder verleihst gerne. Vielleicht zählst du nicht nach, wer zuletzt bezahlt hat.", "im_beruf": "Du teilst dein Wissen und gönnst anderen ihren Erfolg.", "im_privatleben": "Du gibst Zeit, Geld oder Aufmerksamkeit, weil es dir Freude macht.", "gegenpol_id": null}, {"id": "W-035", "name": "Harmonie", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, dass es zwischen Menschen friedlich zugeht und Streit nicht den Alltag bestimmt.", "daran_kann_es_sich_zeigen": "Du suchst das Verbindende. Vielleicht möchtest du einen Streit bald klären, statt ihn stehen zu lassen.", "im_beruf": "Ein gutes Klima im Team ist dir viel wert.", "im_privatleben": "Du möchtest, dass alle an einem Tisch sitzen können, auch wenn sie verschiedener Meinung sind.", "gegenpol_id": "W-059"}, {"id": "W-036", "name": "Dankbarkeit", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, zu schätzen, was du hast und was andere für dich tun.", "daran_kann_es_sich_zeigen": "Du sagst Danke und meinst es. Vielleicht freust du dich oft über Kleinigkeiten.", "im_beruf": "Du würdigst, was andere beitragen, und freust dich, wenn auch dein Beitrag gesehen wird.", "im_privatleben": "Du nimmst das Gute in deinem Leben nicht als selbstverständlich.", "gegenpol_id": null}, {"id": "W-037", "name": "Bescheidenheit", "kategorie_id": "K-04", "kurz_gesagt": "Dir ist wichtig, dich selbst nicht wichtiger zu nehmen als andere.", "daran_kann_es_sich_zeigen": "Du lässt lieber deine Arbeit für dich sprechen. Vielleicht ist es dir unangenehm, im Mittelpunkt zu stehen.", "im_beruf": "Du brauchst keinen Titel und keine Bühne, um gute Arbeit zu machen.", "im_privatleben": "Du freust dich still über einen Erfolg und musst ihn nicht herumzeigen.", "gegenpol_id": "W-053"}, {"id": "W-038", "name": "Sinn", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, zu wissen, wofür du etwas tust.", "daran_kann_es_sich_zeigen": "Du fragst bei einer Aufgabe nach dem Wozu. Vielleicht hältst du viel aus, wenn du weißt, wofür es gut ist.", "im_beruf": "Du möchtest, dass deine Arbeit jemandem nützt oder etwas besser macht.", "im_privatleben": "Du verbringst deine Zeit gerne mit Dingen, die dir etwas bedeuten.", "gegenpol_id": null}, {"id": "W-039", "name": "Berufung", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, das zu tun, was wirklich deins ist.", "daran_kann_es_sich_zeigen": "Es gibt Tätigkeiten, bei denen du die Zeit vergisst. Vielleicht gibt es etwas, das du schon als Kind gerne gemacht hast und das dich bis heute nicht loslässt.", "im_beruf": "Du möchtest einer Tätigkeit nachgehen, die für dich mehr ist als ein Arbeitsplatz.", "im_privatleben": "Deine Aufgabe kann auch außerhalb der Arbeit liegen, z.B. in einem Ehrenamt, in der Familie oder in einer Kunst.", "gegenpol_id": null}, {"id": "W-040", "name": "Wirksamkeit", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, zu sehen, dass dein Tun etwas bewirkt.", "daran_kann_es_sich_zeigen": "Du möchtest sagen können: Das ist heute durch mich anders geworden. Vielleicht macht es dich mürbe, für die Schublade zu arbeiten.", "im_beruf": "Du möchtest Ergebnisse sehen und nicht nur beschäftigt sein.", "im_privatleben": "Du packst gerne dort an, wo man hinterher einen Unterschied sieht, z.B. beim Renovieren.", "gegenpol_id": null}, {"id": "W-041", "name": "Verantwortung", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, für das einzustehen, was dir anvertraut ist und was du entschieden hast.", "daran_kann_es_sich_zeigen": "Du stehst zu deinen Entscheidungen. Vielleicht stehst du auch dann gerade, wenn etwas schiefgegangen ist.", "im_beruf": "Du übernimmst gerne Aufgaben, bei denen es auf dich ankommt.", "im_privatleben": "Du sorgst dafür, dass Wichtiges geregelt ist, für dich und für die, die auf dich zählen.", "gegenpol_id": null}, {"id": "W-042", "name": "Gemeinwohl", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, etwas für das Ganze zu tun und nicht nur für dich und die Deinen.", "daran_kann_es_sich_zeigen": "Du setzt dich für Dinge ein, die allen zugutekommen. Vielleicht denkst du bei Entscheidungen mit, was sie für andere bedeuten.", "im_beruf": "Du möchtest für etwas arbeiten, das der Gesellschaft nützt.", "im_privatleben": "Du bringst dich ein, z.B. im Gemeinderat, bei der Tafel oder in einer Bürgerinitiative.", "gegenpol_id": null}, {"id": "W-043", "name": "Weitergeben", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, das, was du weißt und kannst, an andere weiterzugeben, damit es bleibt.", "daran_kann_es_sich_zeigen": "Du erklärst gerne und freust dich, wenn Jüngere von dir lernen. Vielleicht fragst du dich, was von dir einmal bleibt.", "im_beruf": "Du arbeitest gerne Neue ein, bildest aus oder begleitest Jüngere.", "im_privatleben": "Du gibst Erfahrungen, Geschichten oder ein Handwerk an Kinder und Enkel weiter.", "gegenpol_id": null}, {"id": "W-044", "name": "Spiritualität", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, dich als Teil von etwas Größerem zu erleben, unabhängig davon, ob du es Gott, Natur oder gar nicht benennst.", "daran_kann_es_sich_zeigen": "Es gibt Momente, in denen du dich getragen fühlst, z.B. im Gebet, in der Stille oder unter dem Sternenhimmel. Vielleicht beschäftigen dich Fragen wie: Woher komme ich, wohin gehe ich?", "im_beruf": "Du brauchst auch im Arbeitsalltag Momente der Stille, um bei dir zu bleiben.", "im_privatleben": "Du nimmst dir Zeit für das, was dich innerlich trägt.", "gegenpol_id": null}, {"id": "W-097", "name": "Freude an der Arbeit", "kategorie_id": "K-05", "kurz_gesagt": "Dir ist wichtig, dass dir deine Arbeit Freude macht.", "daran_kann_es_sich_zeigen": "Du freust dich morgens auf deine Aufgaben. Vielleicht merkst du schnell, wenn dir die Freude an der Arbeit verloren geht.", "im_beruf": "Du nimmst lieber eine Stelle, die dir Spaß macht, als eine, die nur gut bezahlt ist.", "im_privatleben": "Auch die Arbeit zu Hause, im Garten oder im Ehrenamt soll dir Freude machen.", "gegenpol_id": null}, {"id": "W-045", "name": "Lernen", "kategorie_id": "K-06", "kurz_gesagt": "Dir ist wichtig, immer wieder etwas Neues zu lernen und zu können.", "daran_kann_es_sich_zeigen": "Du probierst gerne aus, was du noch nicht kannst. Vielleicht hast du immer einen Kurs, ein Buch oder ein neues Vorhaben am Laufen.", "im_beruf": "Du möchtest Aufgaben, bei denen du noch nicht alles weißt.", "im_privatleben": "Du lernst eine Sprache, einen Tanz oder das Töpfern, einfach weil es dich reizt.", "gegenpol_id": null}, {"id": "W-046", "name": "Entwicklung", "kategorie_id": "K-06", "kurz_gesagt": "Dir ist wichtig, dich als Mensch weiterzuentwickeln und an dem zu wachsen, was du erlebst.", "daran_kann_es_sich_zeigen": "Du blickst zurück und bemerkst, was sich in dir verändert hat. Vielleicht haben dich auch schwierige Erfahrungen reifen lassen.", "im_beruf": "Du möchtest an deiner Arbeit als Mensch wachsen, z.B. ruhiger, sicherer oder klarer werden.", "im_privatleben": "Du arbeitest an deinen Gewohnheiten oder an der Art, wie du mit anderen umgehst.", "gegenpol_id": null}, {"id": "W-047", "name": "Wissen", "kategorie_id": "K-06", "kurz_gesagt": "Dir ist wichtig, dich auszukennen und Bescheid zu wissen.", "daran_kann_es_sich_zeigen": "Du liest nach, wenn du etwas nicht weißt. Vielleicht macht es dir Freude, zu einem Thema richtig viel zu wissen.", "im_beruf": "Du möchtest in deinem Fach auf dem Laufenden bleiben.", "im_privatleben": "Du liest viel, schaust Dokumentationen oder sammelst Wissen zu deinem Lieblingsthema.", "gegenpol_id": null}, {"id": "W-048", "name": "Erkenntnis", "kategorie_id": "K-06", "kurz_gesagt": "Dir ist wichtig, herauszufinden, was wahr ist, und zu verstehen, warum die Dinge so sind, wie sie sind.", "daran_kann_es_sich_zeigen": "Du gibst dich nicht mit der ersten Erklärung zufrieden. Vielleicht kennst du die Freude, wenn der Groschen fällt.", "im_beruf": "Du möchtest einer Sache auf den Grund gehen und nicht an der Oberfläche bleiben.", "im_privatleben": "Du denkst gerne nach und führst Gespräche, die in die Tiefe gehen.", "gegenpol_id": null}, {"id": "W-049", "name": "Offenheit", "kategorie_id": "K-06", "kurz_gesagt": "Dir ist wichtig, dich auf Neues und Unbekanntes einzulassen.", "daran_kann_es_sich_zeigen": "Du hörst dir an, was du noch nicht kennst. Vielleicht änderst du deine Meinung, wenn dich etwas überzeugt.", "im_beruf": "Du probierst neue Wege aus und bist neugierig auf andere Sichtweisen.", "im_privatleben": "Du lässt dich auf Menschen und Gedanken ein, die dir zunächst fremd sind.", "gegenpol_id": null}, {"id": "W-050", "name": "Selbsterkenntnis", "kategorie_id": "K-06", "kurz_gesagt": "Dir ist wichtig, dich selbst zu kennen und zu verstehen, warum du so bist, wie du bist.", "daran_kann_es_sich_zeigen": "Du fragst dich, warum dich etwas ärgert oder freut. Vielleicht schreibst du Tagebuch oder sprichst mit jemandem darüber.", "im_beruf": "Du möchtest wissen, was dir liegt und was nicht, und deine Arbeit danach ausrichten.", "im_privatleben": "Du schaust hin, warum du in manchen Situationen immer gleich reagierst.", "gegenpol_id": null}, {"id": "W-051", "name": "Erfolg", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, zu erreichen, was du dir vorgenommen hast.", "daran_kann_es_sich_zeigen": "Du setzt dir Ziele und bleibst dran. Vielleicht gibt dir ein erreichtes Ziel Schwung für das nächste.", "im_beruf": "Du möchtest vorankommen und Ergebnisse vorweisen können.", "im_privatleben": "Du nimmst dir auch privat etwas vor und freust dich, wenn es gelingt, z.B. ein Haus bauen oder einen Lauf schaffen.", "gegenpol_id": null}, {"id": "W-052", "name": "Leistung", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, dich anzustrengen und etwas zu leisten.", "daran_kann_es_sich_zeigen": "Du gibst gerne alles. Vielleicht bist du am Ende des Tages zufrieden, wenn du viel geschafft hast.", "im_beruf": "Du möchtest gefordert werden und an dem gemessen werden, was du leistest.", "im_privatleben": "Du gehst auch in der Freizeit gerne an deine Grenze, z.B. im Sport.", "gegenpol_id": "W-084"}, {"id": "W-053", "name": "Anerkennung", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, dass gesehen und gewürdigt wird, was du tust.", "daran_kann_es_sich_zeigen": "Ein ehrliches Lob tut dir gut. Vielleicht fehlt dir etwas, wenn dein Einsatz für selbstverständlich genommen wird.", "im_beruf": "Du möchtest Rückmeldung bekommen und dass dein Beitrag beim Namen genannt wird.", "im_privatleben": "Du freust dich, wenn auch zu Hause jemand merkt, was du alles machst.", "gegenpol_id": "W-037"}, {"id": "W-054", "name": "Ansehen", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, einen guten Ruf zu haben und etwas zu gelten.", "daran_kann_es_sich_zeigen": "Dir ist nicht gleich, was man über dich sagt. Vielleicht bedeutet dir eine Position oder ein Titel etwas.", "im_beruf": "Du möchtest eine Stellung haben, die etwas gilt.", "im_privatleben": "Du achtest darauf, welchen Ruf du in deinem Umfeld hast und wie andere dich wahrnehmen.", "gegenpol_id": null}, {"id": "W-055", "name": "Einfluss", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, mitzugestalten und dass dein Wort Gewicht hat.", "daran_kann_es_sich_zeigen": "Du bringst dich ein, wenn etwas entschieden wird. Vielleicht suchst du Plätze, an denen du etwas bewegen kannst.", "im_beruf": "Du möchtest gehört werden, bevor entschieden wird, auch wenn du nicht selbst entscheidest.", "im_privatleben": "Du redest mit, im Elternbeirat, in der Hausgemeinschaft oder in der Familie.", "gegenpol_id": null}, {"id": "W-056", "name": "Macht", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, das Sagen zu haben und entscheiden zu können.", "daran_kann_es_sich_zeigen": "Du übernimmst gerne die Führung. Vielleicht fühlst du dich am wohlsten, wenn die Fäden bei dir zusammenlaufen.", "im_beruf": "Du möchtest eine Stelle, in der du über Richtung, Geld oder Menschen entscheidest.", "im_privatleben": "Du gibst auch privat gerne die Richtung vor, z.B. bei großen Anschaffungen.", "gegenpol_id": null}, {"id": "W-057", "name": "Qualität", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, dass etwas richtig gut gemacht ist.", "daran_kann_es_sich_zeigen": "Du machst keine halben Sachen. Vielleicht siehst du den Fehler, den sonst keiner bemerkt.", "im_beruf": "Du möchtest Arbeit abliefern, hinter der du stehen kannst, und brauchst dafür genug Zeit.", "im_privatleben": "Du kaufst lieber einmal etwas Gutes als dreimal etwas Billiges.", "gegenpol_id": null}, {"id": "W-059", "name": "Wettbewerb", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, dich mit anderen zu messen und zu gewinnen.", "daran_kann_es_sich_zeigen": "Ein Vergleich spornt dich an. Vielleicht gibst du erst richtig Gas, wenn jemand neben dir läuft.", "im_beruf": "Du magst es, wenn klar ist, wer vorne liegt, z.B. bei Zielen oder Ausschreibungen.", "im_privatleben": "Du spielst, um zu gewinnen, beim Sport wie beim Kartenspiel.", "gegenpol_id": "W-035"}, {"id": "W-060", "name": "Herausforderung", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, Aufgaben zu haben, die dich fordern und bei denen nicht sicher ist, ob du sie schaffst.", "daran_kann_es_sich_zeigen": "Das Schwierige reizt dich mehr als das Bequeme. Vielleicht wird dir langweilig, wenn alles glattläuft.", "im_beruf": "Du suchst die Aufgabe, an die sich sonst niemand herantraut.", "im_privatleben": "Du nimmst dir etwas vor, das dich Überwindung kostet, z.B. eine lange Wanderung.", "gegenpol_id": null}, {"id": "W-094", "name": "Effizienz", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, Dinge ohne Umwege zu erledigen und keine Zeit und Kraft zu verschwenden.", "daran_kann_es_sich_zeigen": "Du suchst den kürzesten Weg zum Ziel. Vielleicht ärgern dich Besprechungen, die sich im Kreis drehen.", "im_beruf": "Du möchtest die Arbeit so anpacken, dass mit wenig Aufwand viel herauskommt.", "im_privatleben": "Du erledigst Besorgungen gerne in einem Rutsch, damit Zeit für anderes bleibt.", "gegenpol_id": null}, {"id": "W-095", "name": "Karriereentwicklung", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, beruflich weiterzukommen: in eine neue Rolle, zu mehr Verantwortung oder auf einen anderen Weg.", "daran_kann_es_sich_zeigen": "Du hast im Blick, wie dein nächster beruflicher Schritt aussehen kann. Vielleicht wird es dir eng, wenn sich in deinem Beruf lange nichts bewegt.", "im_beruf": "Du möchtest wissen, welche Möglichkeiten es für dich gibt, und sie nutzen.", "im_privatleben": "Du steckst Zeit und Geld in Weiterbildungen, die dich beruflich weiterbringen.", "gegenpol_id": null}, {"id": "W-096", "name": "Unternehmergeist", "kategorie_id": "K-07", "kurz_gesagt": "Dir ist wichtig, etwas Eigenes aufzubauen und dafür auch ein Risiko einzugehen.", "daran_kann_es_sich_zeigen": "Du siehst überall Möglichkeiten für ein Angebot oder eine Geschäftsidee. Vielleicht reizt dich der Gedanke, dein eigener Chef zu sein.", "im_beruf": "Du möchtest selbstständig arbeiten oder im Unternehmen wie ein Unternehmer handeln dürfen.", "im_privatleben": "Du stellst gerne etwas auf die Beine, z.B. einen kleinen Onlineshop oder ein Fest im Verein.", "gegenpol_id": null}, {"id": "W-061", "name": "Kreativität", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, eigene Ideen zu haben und deiner Fantasie freien Lauf zu lassen.", "daran_kann_es_sich_zeigen": "Dir fällt ein, worauf andere nicht kommen. Vielleicht malst, schreibst, kochst oder bastelst du ohne Vorlage.", "im_beruf": "Du möchtest eigene Lösungen finden dürfen, statt nur Vorgaben abzuarbeiten.", "im_privatleben": "Du brauchst Zeit und einen Platz, an dem du etwas ausprobieren kannst.", "gegenpol_id": null}, {"id": "W-062", "name": "Gestaltung", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, den Dingen eine Form zu geben und etwas nach deinen Vorstellungen aufzubauen.", "daran_kann_es_sich_zeigen": "Du richtest gerne ein, ordnest neu oder baust etwas auf. Vielleicht siehst du sofort, wie etwas besser aussehen oder laufen könnte.", "im_beruf": "Du möchtest etwas aufbauen oder umbauen: einen Bereich, einen Ablauf oder ein Produkt.", "im_privatleben": "Du gestaltest deine Wohnung, deinen Garten oder ein Fest so, wie du es dir vorstellst.", "gegenpol_id": null}, {"id": "W-063", "name": "Selbstverwirklichung", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, deine Fähigkeiten, Interessen und Wünsche auch wirklich zu leben.", "daran_kann_es_sich_zeigen": "Du hast Träume und gehst ihnen nach. Vielleicht spürst du genau, wenn ein Teil von dir zu kurz kommt.", "im_beruf": "Du möchtest deine Fähigkeiten ganz einsetzen können und nicht nur einen Teil davon.", "im_privatleben": "Du nimmst dir Raum für das, was du schon immer machen wolltest, z.B. ein Buch schreiben oder einen Flugschein machen.", "gegenpol_id": null}, {"id": "W-064", "name": "Schönheit", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, von Schönem umgeben zu sein.", "daran_kann_es_sich_zeigen": "Du hast einen Blick für Farben, Formen und Klänge. Vielleicht kann dich ein schöner Raum oder ein besonderes Licht richtig froh machen.", "im_beruf": "Du arbeitest gerne in einer Umgebung, die dir gefällt, und achtest darauf, wie etwas aussieht.", "im_privatleben": "Blumen, ein gedeckter Tisch oder ein schönes Kleidungsstück sind für dich kein Luxus.", "gegenpol_id": null}, {"id": "W-065", "name": "Innovation", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, zu hinterfragen, wie etwas bisher gemacht wird, und neue Lösungen zu finden.", "daran_kann_es_sich_zeigen": "Du fragst: Geht das nicht besser? Vielleicht reizt dich das, was es noch nicht gibt, mehr als das Bewährte.", "im_beruf": "Du möchtest neue Wege, Verfahren oder Produkte entwickeln.", "im_privatleben": "Du probierst neue Technik und neue Lösungen früh aus.", "gegenpol_id": "W-011"}, {"id": "W-066", "name": "Kultur", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, dass Kunst, Musik, Bücher oder Theater zu deinem Leben gehören.", "daran_kann_es_sich_zeigen": "Ein Konzert, ein Buch oder eine Ausstellung beschäftigt dich noch lange. Vielleicht fehlt dir etwas, wenn du lange nichts davon hattest.", "im_beruf": "Du arbeitest gerne in einem Umfeld, in dem Bildung und Kultur geschätzt werden.", "im_privatleben": "Du gehst ins Konzert, liest, spielst Theater oder besuchst Museen.", "gegenpol_id": null}, {"id": "W-067", "name": "Mut", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, dich zu trauen, auch wenn du Angst hast.", "daran_kann_es_sich_zeigen": "Du sagst, was gesagt werden muss. Vielleicht gehst du einen Schritt, obwohl du nicht weißt, wie er ausgeht.", "im_beruf": "Du sprichst Unbequemes an oder wagst einen Neuanfang.", "im_privatleben": "Du stehst für dich oder für andere ein, auch wenn es Gegenwind gibt.", "gegenpol_id": null}, {"id": "W-068", "name": "Selbstvertrauen", "kategorie_id": "K-08", "kurz_gesagt": "Dir ist wichtig, dir selbst und deinen Entscheidungen zu trauen.", "daran_kann_es_sich_zeigen": "Du verlässt dich auf dein eigenes Gespür. Vielleicht weißt du, wie gut es tut, wenn du dir etwas zutraust und es gelingt.", "im_beruf": "Du traust dir auch Aufgaben zu, die du noch nie gemacht hast.", "im_privatleben const KEY = 'leichtart-werte-test-v1';

try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(fresh(), JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = document.getElementById('app'), bar = document.getElementById('bar');

function go(step, cat) { S.step = step; if (cat !== undefined) S.cat = cat; save(); render(); window.scrollTo(0, 0); }
function progress() {
  const order = { start: 0, intro: 1, entdecken: 2 + S.cat, verdichten: 14, hinschauen: 15, zurueck: 16, nachvorn: 17, profil: 18 };
  bar.style.width = Math.round(100 * order[S.step] / 18) + '%';
}
function candidates() {
  let c = V.filter(v => S.ans[v.id] === 'w');
  const extra = c.length < 5;

  return { list: c, extra };
}
function cleanTop() {
  const ok = new Set(candidates().list.map(v => v.id));

}

}

      <p>Du möchtest lieber persönlich darüber sprechen? Dann buche dein kostenfreies Kennenlern&shy;gespräch. Ich rufe dich an, und wir schauen in 15 Minuten gemeinsam, was du jetzt brauchst und ob ich dich dabei unterstützen kann.</p>
      <p><a class="mehr" href="https://alfima.com/leichtART/kostenfreies-online-erstgesprach" target="_blank" rel="noopener">Kennenlern&shy;gespräch buchen</a></p>
    </section>
    <div class="nav noprint">
      <button class="btn ghost" id="back">Antworten ändern</button>
      <button class="btn ghost" id="copy">Profil als Text kopieren</button>
      ${inFrame ? '' : '<button class="btn primary" id="print">Als PDF speichern oder drucken</button>'}
    </div>
    <div class="stack noprint" id="copybox" hidden><p class="hint" id="copymsg"></p><textarea id="copyout" readonly></textarea></div>
    ${inFrame ? '<p class="small noprint">In dieser Vorschau gibt es keinen Druckknopf. Auf der fertigen Seite kannst du das Profil als PDF speichern.</p>' : ''}
    <div class="nav noprint"><button class="btn ghost" id="reset">Von vorne beginnen</button><span></span></div></div>`;
  [...QS, ['weiterdenken']].forEach(q => { const t = document.getElementById('n-' + q[0]); const grow = () => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 4) + 'px'; }; t.oninput = () => { S.notes[q[0]] = t.value; save(); grow(); }; grow(); });
  document.getElementById('back').onclick = () => go('nachvorn');
  const pr = document.getElementById('print'); if (pr) pr.onclick = () => window.print();
  document.getElementById('copy').onclick = () => {
    const txt = profileText(), box = document.getElementById('copybox'), msg = document.getElementById('copymsg');
    document.getElementById('copyout').value = txt; box.hidden = false;
    const fail = () => { msg.textContent = 'Markiere den Text im Feld und kopiere ihn.'; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Kopiert. Du kannst das Profil jetzt in ein Dokument oder eine Mail einfügen.'; }, fail); } catch (e) { fail(); }
  };
  resetBtn(document.getElementById('reset'));
}

function profileText() {
  const P = profileData(), n = l => l.length ? l.map(v => v.name).join(', ') : 'kein Wert';
  const L = ['MEIN WERTEPROFIL', 'leichtART Wertewelt', '', 'Meine wichtigsten Werte'];
  P.top.forEach(v => L.push('- ' + v.name + ': ' + v.kurz_gesagt));
  L.push('', 'Das hat aktuell viel Raum: ' + n(P.by('viel')), 'Das hat aktuell etwas Raum: ' + n(P.by('etwas')), 'Das kommt aktuell zu kurz: ' + n(P.by('kaum')));
  if (P.by('ka').length) L.push('Das kann ich gerade nicht einschätzen: ' + n(P.by('ka')));
  L.push('', 'Meine Spannungsfelder: ' + (P.pairs.length ? P.pairs.map(p => p[0].name + ' und ' + p[1].name).join('; ') : 'keine'));
  L.push('Meine Schwerpunkte: ' + P.kc.map(x => x[0] + ': ' + anzahl(x[1])).join(', '));
  if (S.frueher.length) L.push('', 'Das war mir früher wichtig', 'Fehlt mir: ' + n(P.fr('ja')), 'Fehlt mir nicht: ' + n(P.fr('nein')), 'Weiß ich nicht: ' + n(P.fr('ka')));
  if (P.zu.length) { L.push('', 'Das soll künftig mehr Raum bekommen'); P.zu.forEach(v => L.push('- ' + v.name + ': ' + bisLabel(S.zbis[v.id]) + (S.zschritt[v.id] ? '. Mein erster kleiner Schritt: ' + S.zschritt[v.id] : ''))); }
  L.push('', 'Meine Gedanken dazu');
  QS.forEach(q => L.push(q[1], S.notes[q[0]] || '(noch nichts eingetragen)', ''));
  L.push('Eine Frage zum Weiterdenken', P.frage, S.notes.weiterdenken || '(noch nichts eingetragen)');
  return L.join('\n');
}
render();
</script>
